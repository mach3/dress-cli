[package]
name = "dress-cli"
version = "0.2.0"
edition = "2024"
description = "Render Markdown in the terminal with paging and vim keybindings"
repository = "https://github.com/mach3/dress-cli"
license = "MIT"

[[bin]]
name = "dress"
path = "src/main.rs"

[dependencies]
# TUI framework
ratatui = "0.29"

# Markdown parsing (GFM support)
comrak = { version = "0.36", default-features = false }

# Syntax highlighting
syntect = { version = "5.2", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Unicode display width (ステータスバーのレイアウトに使用)
unicode-width = "0.2"

# Error handling
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
